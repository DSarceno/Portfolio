name: simgen
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - jinja2>=3.1
  - ffmpeg>=6.0          # required by Manim for video encoding
  - pytest>=7.4
  - pytest-cov>=4.1
  - pip>=23.0
  - pip:
      - anthropic>=0.39  # LLM-backed generation (needs ANTHROPIC_API_KEY)
      - manim>=0.18      # animation rendering
