[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simgen"
version = "0.1.0"
description = "Prompt-driven generator of math/physics simulations, plots, Manim animations and LaTeX reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Simulator Project Authors", email = "dsarceno68@gmail.com" }]
keywords = [
    "simulation",
    "physics",
    "mathematics",
    "manim",
    "numerical-methods",
    "education",
    "code-generation",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]
animation = ["manim>=0.18"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
]
all = ["anthropic>=0.39", "manim>=0.18"]

[project.urls]
Homepage = "https://github.com/dsarceno/simulator"
Documentation = "https://github.com/dsarceno/simulator/tree/main/docs"
Repository = "https://github.com/dsarceno/simulator"

[project.scripts]
simgen = "simgen.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simgen = ["codegen/templates/*.j2"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
