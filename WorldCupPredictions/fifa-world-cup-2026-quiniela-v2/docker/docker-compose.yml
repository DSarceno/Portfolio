version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: wc2026-quiniela:latest
    container_name: wc2026-quiniela-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - SIMULATION_RUNS=2000
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../outputs:/app/outputs
      - ../logs:/app/logs
    restart: unless-stopped
