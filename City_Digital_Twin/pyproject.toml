[project]
name = "city-twin"
version = "0.0.0"
description = "Guatemala City Mobility Digital Twin — state-space modeling and simulation of urban mobility"
requires-python = ">=3.12"
readme = "README.md"

# Phase 1 needs only the scientific-computing and geospatial core.
# Heavier stack (torch, fastapi, timescale, prefect, streamlit) is added per phase.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "networkx>=3.3",
    "osmnx>=2.0",
    "geopandas>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Phase 3 — scientific ML dynamics (Neural ODE).
ml = [
    "torch>=2.2",
    "torchdiffeq>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
